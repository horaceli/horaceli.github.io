Sit for 5 seconds
Sit while you leave the room and knock or ring the bell for 3 seconds and return
Sit while you leave the room and knock or ring the bell for 5 seconds
Sit while you leave the room and talk to people who aren't there for 3 seconds.
Sit while you leave the room and talk to people who aren't there for 5 seconds
Sit while you leave the room and talk to people who aren't there for 10 seconds
Sit while you run around the dog
Sit for 10 seconds while you sit in a chair
Sit for 30 seconds while you sit in a chair
Sit for 15 seconds while you jog and clap
Sit for 5 seconds`
        ];

        function parseTaskSets(rawArray) {
            return rawArray.map((rawText, index) => {
                const lines = rawText.split('\n').map(l => l.trim()).filter(l => l);
                const tasks = [];
                for (let line of lines) {
                    if (line.startsWith('→')) {
                        if (tasks.length > 0) {
                            tasks[tasks.length - 1].note = line.substring(1).trim();
                        }
                    } else {
                        // Extract time via regex. Covers "Sit for X seconds" and "for X seconds"
                        let duration = 0;
                        const secMatch = line.match(/(\d+)\s+second/);
                        if (secMatch) {
                            duration = parseInt(secMatch[1], 10);
                        }
                        tasks.push({ text: line, duration, note: null });
                    }
                }
                return { id: index + 1, title: `Task Set ${index + 1}`, tasks };
            });
        }

        const taskData = parseTaskSets(RAW_TASK_SETS);

        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.type = 'sine';
                // A pleasant, soft chime tone
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                console.log('Audio error:', e);
            }
        };

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [selectedSet, setSelectedSet] = useState(null);

            return (
                <div className="min-h-screen max-w-md mx-auto bg-white shadow-xl flex flex-col relative overflow-hidden">
                    {/* Header */}
                    <div className="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
                        {selectedSet !== null ? (
                            <button onClick={() => setSelectedSet(null)} className="flex items-center space-x-2 bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition-colors">
                                <i className="fas fa-chevron-left"></i>
                                <span className="font-semibold text-sm">Back</span>
                            </button>
                        ) : (
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">Relaxation Protocol</h1>
                                <p className="text-blue-200 text-xs mt-0.5">Overall KL Tier 1</p>
                            </div>
                        )}
                        {selectedSet !== null && (
                            <div className="text-right">
                                <h1 className="text-lg font-bold">Set {selectedSet + 1}</h1>
                            </div>
                        )}
                    </div>

                    {/* Content Body */}
                    <div className="flex-1 overflow-y-auto bg-gray-50 p-4">
                        {selectedSet === null ? (
                            <MenuScreen onSelectSet={setSelectedSet} />
                        ) : (
                            <TaskRunner 
                                taskSet={taskData[selectedSet]} 
                                onComplete={() => setSelectedSet(null)}
                            />
                        )}
                    </div>
                </div>
            );
        };

        const MenuScreen = ({ onSelectSet }) => {
            return (
                <div>
                    <p className="text-gray-600 mb-6 text-sm">
                        Select a Task Set to begin. Move through these at your pet's pace. Never rush.
                    </p>
                    <div className="grid grid-cols-2 gap-3">
                        {taskData.map((set, index) => (
                            <button 
                                key={set.id}
                                onClick={() => onSelectSet(index)}
                                className="bg-white border border-gray-200 shadow-sm p-4 rounded-xl flex flex-col items-center justify-center space-y-2 hover:bg-blue-50 hover:border-blue-300 transition-all active:scale-95"
                            >
                                <div className="h-10 w-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-lg font-bold">
                                    {set.id}
                                </div>
                                <span className="font-medium text-gray-700">{set.title}</span>
                                <span className="text-xs text-gray-400">{set.tasks.length} steps</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const TaskRunner = ({ taskSet, onComplete }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const [completed, setCompleted] = useState(false);
            
            const task = taskSet.tasks[currentIndex];
            
            // Setup when task changes
            useEffect(() => {
                setIsRunning(false);
                setCompleted(false);
                if (task.duration > 0) {
                    setTimeLeft(task.duration);
                } else {
                    setTimeLeft(0);
                }
            }, [currentIndex, task]);

            // Timer logic
            useEffect(() => {
                let interval;
                if (isRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (isRunning && timeLeft === 0) {
                    setIsRunning(false);
                    setCompleted(true);
                    playBeep();
                }
                return () => clearInterval(interval);
            }, [isRunning, timeLeft]);

            const handleNext = () => {
                if (currentIndex < taskSet.tasks.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                } else {
                    onComplete(); // Done with set!
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(prev => prev - 1);
                }
            };

            const toggleTimer = () => {
                if (timeLeft === 0 && completed) {
                    // Reset
                    setTimeLeft(task.duration);
                    setCompleted(false);
                    setIsRunning(true);
                } else {
                    setIsRunning(!isRunning);
                }
            };
            
            const skipTimer = () => {
                setIsRunning(false);
                setTimeLeft(0);
                setCompleted(true);
                playBeep();
            };

            const resetTimer = () => {
                setIsRunning(false);
                setTimeLeft(task.duration);
                setCompleted(false);
            };

            const progressPercentage = ((currentIndex) / taskSet.tasks.length) * 100;
            const hasTimer = task.duration > 0;

            return (
                <div className="flex flex-col h-full">
                    {/* Progress Bar */}
                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                        <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${progressPercentage}%` }}></div>
                    </div>
                    
                    <div className="flex items-center justify-between text-xs font-semibold text-gray-500 mb-3 px-1 uppercase tracking-wide">
                        <span>Step {currentIndex + 1} of {taskSet.tasks.length}</span>
                        <span>{Math.round(progressPercentage)}% Complete</span>
                    </div>

                    {/* Navigation Controls - Placed above main content */}
                    <div className="flex items-center justify-between mb-4 gap-3">
                        <button 
                            onClick={handlePrev} 
                            disabled={currentIndex === 0}
                            className={`px-4 py-3 rounded-xl flex items-center justify-center transition-all ${currentIndex === 0 ? 'text-gray-300 bg-gray-100 cursor-not-allowed border border-transparent' : 'text-gray-700 bg-white shadow-sm border border-gray-200 hover:bg-gray-50 active:scale-95'}`}
                            title="Previous Step"
                        >
                            <i className="fas fa-arrow-left mr-2"></i>
                            <span className="font-semibold text-sm">Prev</span>
                        </button>
                        
                        <button 
                            onClick={handleNext}
                            className={`flex-1 py-3 px-4 rounded-xl font-bold flex items-center justify-center text-white shadow-md transition-all active:scale-95 ${(hasTimer && !completed) ? 'bg-blue-500 hover:bg-blue-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                        >
                            {currentIndex === taskSet.tasks.length - 1 ? (
                                <>Finish Set <i className="fas fa-flag-checkered ml-2"></i></>
                            ) : (
                                <>Next Step <i className="fas fa-arrow-right ml-2"></i></>
                            )}
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex-1 flex flex-col justify-center">
                        <h2 className="text-2xl font-bold text-gray-800 text-center mb-6 leading-tight">
                            {task.text}
                        </h2>

                        {hasTimer && (
                            <div className="flex flex-col items-center justify-center my-6">
                                <div className="relative w-48 h-48 flex items-center justify-center mb-4">
                                    <svg className="absolute top-0 left-0 w-full h-full transform -rotate-90">
                                        <circle cx="96" cy="96" r="88" stroke="#e5e7eb" strokeWidth="8" fill="transparent" />
                                        <circle 
                                            cx="96" cy="96" r="88" 
                                            stroke={completed ? "#10b981" : "#3b82f6"} 
                                            strokeWidth="8" 
                                            fill="transparent" 
                                            strokeDasharray="552.9"
                                            strokeDashoffset={completed ? 0 : 552.9 - (552.9 * (timeLeft / task.duration))}
                                            className="timer-circle"
                                        />
                                    </svg>
                                    <span className="text-5xl font-mono font-bold text-gray-700">
                                        {Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
                                    </span>
                                </div>
                                
                                <div className="flex space-x-3 w-full">
                                    {!completed ? (
                                        <>
                                            <button 
                                                onClick={toggleTimer}
                                                className={`flex-1 py-3 rounded-xl font-bold text-white shadow-md transition-all active:scale-95 ${isRunning ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}
                                            >
                                                <i className={`fas ${isRunning ? 'fa-pause' : 'fa-play'} mr-2`}></i>
                                                {isRunning ? 'Pause' : (timeLeft < task.duration ? 'Resume' : 'Start')}
                                            </button>
                                            
                                            <button onClick={resetTimer} className="px-4 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 active:scale-95 transition-all" title="Reset Timer">
                                                <i className="fas fa-rotate-left"></i>
                                            </button>

                                            {isRunning && (
                                                 <button onClick={skipTimer} className="px-4 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 active:scale-95 transition-all" title="Skip Timer">
                                                    <i className="fas fa-forward"></i>
                                                </button>
                                            )}
                                        </>
                                    ) : (
                                        <>
                                            <div className="flex-1 py-3 bg-green-100 text-green-700 rounded-xl font-bold text-center flex items-center justify-center">
                                                <i className="fas fa-check-circle mr-2 text-xl"></i> Time's up! Treat!
                                            </div>
                                            
                                            <button onClick={resetTimer} className="px-4 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 active:scale-95 transition-all" title="Reset Timer">
                                                <i className="fas fa-rotate-left"></i>
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {task.note && (
                            <div className="mt-auto bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg">
                                <div className="flex">
                                    <div className="flex-shrink-0">
                                        <i className="fas fa-exclamation-triangle text-amber-500"></i>
                                    </div>
                                    <div className="ml-3">
                                        <p className="text-sm text-amber-800 font-medium">Note</p>
                                        <p className="text-sm text-amber-700 mt-1">{task.note.replace(/^\(Note:\s*|\)$/g, '')}</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
